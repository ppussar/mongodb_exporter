name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9

  build:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: build
      run: make build
    - name: check go.sum is up to date
      run: |
        go mod tidy
        git diff --exit-code go.sum go.mod
    - name: coverage
      run: make cover

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: start demo
        run: docker compose -f docker/docker-compose.yaml up --build -d
      - name: wait for exporter to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/health; then
              echo "Exporter is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Exporter did not become ready in time"
          docker compose -f docker/docker-compose.yaml logs
          exit 1
      - name: verify prometheus metrics
        run: |
          OUTPUT=$(curl -sf http://localhost:9090/prometheus)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'fruitstore_stock{' || (echo "ERROR: fruitstore_stock missing"; exit 1)
          echo "$OUTPUT" | grep -q 'fruitstore_total{' || (echo "ERROR: fruitstore_total missing"; exit 1)
          echo "Smoke test passed"
      - name: stop demo
        if: always()
        run: docker compose -f docker/docker-compose.yaml down --remove-orphans

  release:
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: write
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: go-semantic-release/action@v1
        with:
          hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: make image
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: publish image
        if: github.ref == 'refs/heads/master'
        run: make push-image
