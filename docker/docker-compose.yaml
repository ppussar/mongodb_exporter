---
services:
  database:
    image: 'mongo:9.0' # NOTE: mongo 8.0+ (incl. 9.0) crashes on Linux kernel 6.19-7.0.13 (tcmalloc/rseq, SERVER-121912); a startup guard stops the server on affected kernels. See https://www.mongodb.com/docs/manual/administration/production-notes/
    container_name: database
    environment:
      MONGO_INITDB_DATABASE: fruitstore
    volumes:
      - ./fruits.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017-27017:27017-27017"
    restart: always
    healthcheck:
      test: "if mongosh --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'; then exit 0; fi; exit 1;"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  exporter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: exporter
    environment:
      CONFIG: "/configuration.yaml"
    volumes:
      - ./configuration.yaml:/configuration.yaml
    ports:
      - "9090:9090"
    links:
      - database
    depends_on:
      - database
    restart: always
